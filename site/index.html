<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    color-scheme:dark;
    --bg:#020817; --panel:#091426; --panel-2:#0d1a30; --line:#20314d;
    --accent:#25b9f4; --accent-2:#7764f6; --emerald:#2dd4a1; --emerald-soft:#064e3b;
    --text:#f5f8ff; --muted:#9aa9bf; --soft:#111e34; --danger:#fb7185;
    --shadow:0 18px 55px rgba(0,0,0,.25);
  }
  :root[data-theme="light"]{
    color-scheme:light;
    --bg:#f6f8fc; --panel:#ffffff; --panel-2:#f8fbff; --line:#dbe5f1;
    --text:#10213f; --muted:#60708a; --soft:#eef5fb; --shadow:0 16px 44px rgba(55,84,130,.10);
  }
  :root[data-theme="light"] .text-white,:root[data-theme="light"] .text-slate-100,:root[data-theme="light"] .text-slate-200,:root[data-theme="light"] .text-slate-300{color:var(--text)!important}
  :root[data-theme="light"] .text-slate-400,:root[data-theme="light"] .text-slate-500,:root[data-theme="light"] .text-slate-600{color:var(--muted)!important}
  :root[data-theme="light"] .bg-slate-950\/50,:root[data-theme="light"] .bg-slate-950\/60,:root[data-theme="light"] .bg-slate-950\/70,:root[data-theme="light"] .bg-slate-800{background:var(--soft)!important}
  :root[data-theme="light"] .border-slate-800,:root[data-theme="light"] .border-slate-800\/60,:root[data-theme="light"] .border-slate-800\/70,:root[data-theme="light"] .border-slate-700{border-color:var(--line)!important}
  * { box-sizing:border-box; }
  html, body { background:var(--bg); overflow-x:hidden; min-height:100%; }
  body { font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; color:var(--text); letter-spacing:-.01em; }
  h1,h2,h3,.heading-font{font-family:Manrope,Inter,sans-serif;letter-spacing:-.02em}.hud{font-family:'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#1e293b;border-radius:8px;}
  ::-webkit-scrollbar-thumb:hover{background:#334155;}
  .hidden{display:none !important;}
  .view{display:none;}
  .view.active{display:block; animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  @keyframes zoomIn{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:scale(1);}}
  .zoom-in{animation:zoomIn .2s ease;}
  @keyframes floatUp{0%{opacity:0;transform:translateY(6px) scale(.9);}15%{opacity:1;transform:translateY(0) scale(1);}80%{opacity:1;}100%{opacity:0;transform:translateY(-22px) scale(1);}}
  .xp-float{animation:floatUp 1.3s ease forwards;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .spin{animation:spin 1s linear infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.4);}70%{box-shadow:0 0 0 8px rgba(16,185,129,0);}100%{box-shadow:0 0 0 0 rgba(16,185,129,0);}}
  @keyframes breathe{0%,100%{transform:perspective(600px) rotateX(var(--tilt-y,0deg)) rotateY(var(--tilt-x,0deg)) scale(1);filter:saturate(.94) brightness(.98);box-shadow:0 0 38px rgba(37,185,244,.30),0 18px 45px rgba(85,65,246,.22),inset -22px -24px 38px rgba(28,18,105,.34),inset 18px 15px 30px rgba(255,255,255,.20)}50%{transform:perspective(600px) rotateX(var(--tilt-y,0deg)) rotateY(var(--tilt-x,0deg)) scale(1.04);filter:saturate(1.08) brightness(1.05);box-shadow:0 0 68px rgba(37,185,244,.50),0 22px 62px rgba(119,100,246,.30),inset -26px -28px 42px rgba(28,18,105,.30),inset 20px 17px 34px rgba(255,255,255,.26)}}
  @keyframes orbFloat{0%,100%{transform:translateY(5px)}50%{transform:translateY(-9px)}}
  @keyframes auraSmokeDrift{0%,100%{transform:translate3d(-4%,-1%,0) skewX(-7deg) scaleX(.93);opacity:.58}30%{transform:translate3d(3%,-7%,0) skewX(5deg) scaleX(1.07);opacity:.84}62%{transform:translate3d(6%,5%,0) skewX(-3deg) scaleX(.98);opacity:.66}82%{transform:translate3d(-2%,7%,0) skewX(8deg) scaleX(1.05);opacity:.78}}
  @keyframes auraSmokeCounter{0%,100%{transform:translate3d(5%,6%,0) skewX(7deg) scaleX(1.07);opacity:.38}36%{transform:translate3d(-6%,1%,0) skewX(-8deg) scaleX(.95);opacity:.66}70%{transform:translate3d(3%,-7%,0) skewX(3deg) scaleX(1.03);opacity:.5}}
  @keyframes guidedBreathe{0%,100%{transform:scale(.96);filter:brightness(.94) saturate(.96)}42.857%,57.143%{transform:scale(1.045);filter:brightness(1.12) saturate(1.1)}}
  .pulse-dot{animation:pulse 2s infinite;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);}
  .glass{background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);}
  .task-card{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;}
  .nav-tab{transition:background .15s ease,color .15s ease;border:1px solid transparent;}
  .nav-tab.active{background:rgba(16,185,129,.1);color:#fff;border-color:rgba(16,185,129,.3);}
  .nav-tab:not(.active):hover{background:rgba(148,163,184,.08);}
  input[type=text],input[type=password],input[type=email],input[type=date],input[type=time],textarea,select{background:var(--panel-2);border:1px solid var(--line);color:var(--text);}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--emerald);box-shadow:0 0 0 3px rgba(16,185,129,.15);}
  .btn-primary{background:linear-gradient(110deg,var(--accent),var(--accent-2));color:#fff;font-weight:700;transition:filter .15s ease,transform .1s ease;box-shadow:0 12px 30px rgba(37,185,244,.20);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-primary:active{transform:scale(.98);}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--muted);transition:border-color .15s ease,color .15s ease;}
  .btn-ghost:hover{border-color:#334155;color:var(--text);}
  .checked-item{text-decoration:line-through;color:#475569;}
  .fade-line{color:var(--muted);}
  .doc-card{transition:transform .12s ease,border-color .12s ease;}
  .doc-card:hover{transform:translateY(-2px);border-color:#334155;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;z-index:200;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;}
  .theme-text{color:var(--text)!important}.muted-text{color:var(--muted)!important}.theme-surface{background:var(--panel)!important;border-color:var(--line)!important}
  .theme-toggle{min-width:76px;height:44px;border:1px solid var(--line);background:var(--panel);border-radius:999px;display:inline-flex;align-items:center;justify-content:space-around;color:var(--muted);box-shadow:var(--shadow)}
  .orb-stage{display:inline-block;position:relative;isolation:isolate;animation:orbFloat 6.8s ease-in-out infinite;touch-action:none}
  .orb-stage:before,.orb-stage:after{content:"";position:absolute;pointer-events:none;z-index:0;left:-70%;right:-70%;top:7%;bottom:4%;border-radius:45% 55% 48% 52% / 58% 42% 57% 43%;background:radial-gradient(ellipse 28% 20% at 7% 46%,rgba(37,185,244,.72),transparent 72%),radial-gradient(ellipse 40% 18% at 28% 41%,rgba(59,130,246,.62),transparent 70%),radial-gradient(ellipse 38% 20% at 72% 61%,rgba(119,100,246,.7),transparent 71%),radial-gradient(ellipse 29% 23% at 95% 46%,rgba(232,121,249,.56),transparent 72%),linear-gradient(90deg,transparent 1%,rgba(37,185,244,.3) 24%,rgba(84,78,246,.42) 49%,rgba(168,85,247,.36) 74%,transparent 99%);filter:blur(11px) saturate(1.5);mix-blend-mode:screen;will-change:transform,opacity;animation:auraSmokeDrift 11s cubic-bezier(.45,.05,.55,.95) infinite}
  .orb-stage:after{left:-58%;right:-58%;top:18%;bottom:13%;background:radial-gradient(ellipse 39% 21% at 14% 63%,rgba(14,165,233,.58),transparent 72%),radial-gradient(ellipse 42% 19% at 86% 34%,rgba(139,92,246,.62),transparent 72%),linear-gradient(96deg,transparent 2%,rgba(37,185,244,.24) 27%,rgba(99,102,241,.38) 52%,rgba(244,114,182,.25) 76%,transparent 98%);filter:blur(18px) saturate(1.6);animation:auraSmokeCounter 15s ease-in-out infinite}
  .orb-stage:hover:before,.orb-stage:active:before{opacity:.72;filter:blur(25px) saturate(1.35)}
  .orb-stage:hover:after,.orb-stage:active:after{opacity:.58}
  .orb{width:190px;height:190px;border-radius:50%;position:relative;z-index:1;margin:auto;background:radial-gradient(circle at 34% 25%,rgba(255,255,255,.92) 0 2%,rgba(173,240,255,.50) 3%,transparent 16%),radial-gradient(circle at 50% 48%,#fff 0 4%,#82f4ff 5%,#26c2f5 17%,#536dff 39%,#7650ef 60%,rgba(14,32,68,.18) 72%),linear-gradient(145deg,rgba(255,255,255,.30),rgba(42,18,122,.15));animation:breathe 5.6s ease-in-out infinite;will-change:transform,filter,box-shadow;cursor:pointer;border:1px solid rgba(180,220,255,.30);color:inherit;box-shadow:inset -22px -24px 38px rgba(28,18,105,.34),inset 18px 15px 30px rgba(255,255,255,.20)}
  .orb:before,.orb:after{content:"";position:absolute;border:1px solid rgba(75,163,255,.35);border-radius:50%;inset:-24px}.orb:after{inset:-48px;border-color:rgba(119,100,246,.24)}
  .orb.guided{animation-name:guidedBreathe;animation-duration:14s;animation-timing-function:cubic-bezier(.4,0,.2,1)}.orb.paused{animation-play-state:paused}
  .orb-label{min-height:24px;color:var(--accent);font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .focus-home{min-height:calc(100dvh - 196px);display:flex;flex-direction:column}
  .focus-widget{border-color:rgba(37,185,244,.30)!important}
  .fab{position:fixed;right:22px;bottom:calc(98px + env(safe-area-inset-bottom));z-index:38;width:62px;height:62px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(145deg,var(--accent-2),#a855f7);color:#fff;font-size:1.5rem;font-weight:500;line-height:.8;box-shadow:0 12px 34px rgba(119,100,246,.42)}
  .fab small{font-size:.62rem;line-height:1;margin-top:5px;font-weight:700}
  .home-welcome{padding:20px 2px 4px}.home-orb-wrap{padding:10px 0 16px;text-align:center}
  .home-flow{max-width:576px;width:100%;margin:0 auto}
  .home-open-section{border-top:1px solid var(--line);padding:10px 0}
  .home-section-head{width:100%;min-height:46px;display:flex;align-items:center;gap:10px;text-align:left}
  .home-section-head .chevron{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;color:var(--accent)}
  .home-calendar-days{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:2px 0 10px}
  .home-calendar-day{min-height:58px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:.68rem}
  .home-calendar-day strong{font-size:1rem;color:var(--text);margin-top:2px}
  .home-calendar-day.selected{background:radial-gradient(circle at 32% 22%,rgba(255,255,255,.34),transparent 24%),linear-gradient(145deg,var(--accent-2),#9333ea);color:#fff;box-shadow:0 0 26px rgba(119,100,246,.40)}
  .home-calendar-day.selected strong{color:#fff}
  .home-anchor-strip{display:block;padding:0 0 6px}
  .home-anchor{min-height:64px;display:flex;align-items:center;gap:10px;text-align:left;min-width:0;border-bottom:1px solid var(--line)}
  .home-anchor:last-child{border-bottom:0}
  .home-anchor-title{font-size:.9rem;line-height:1.25;overflow-wrap:anywhere}
  .home-anchor-icon{font-size:1.35rem;color:#e879f9;flex:0 0 auto}
  .home-task-row{width:100%;min-height:64px;display:flex;align-items:center;gap:10px;text-align:left;border-bottom:1px solid var(--line)}
  .home-task-row.featured{padding:4px 10px;border:1px solid rgba(37,185,244,.32);border-radius:17px;background:linear-gradient(90deg,rgba(37,185,244,.07),rgba(119,100,246,.08))}
  .home-complete{min-width:44px;min-height:44px;border-radius:50%;font-size:1.65rem;display:inline-flex;align-items:center;justify-content:center;color:var(--text)}
  .home-play{min-width:46px;min-height:46px;border:2px solid var(--accent);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 0 18px rgba(37,185,244,.28)}
  .home-more{width:100%;min-height:46px;color:var(--accent);font-size:.86rem;font-weight:700}
  .home-collapsed-row{border-top:1px solid var(--line);min-height:60px;display:flex;align-items:center;gap:12px}
  .today-summary{max-width:576px;width:100%;margin:0 auto;overflow:hidden}
  .today-summary-row{width:100%;min-height:50px;display:flex;align-items:center;gap:10px;padding:8px 0;text-align:left;border-top:1px solid var(--line)}
  .today-summary-dot{width:8px;height:8px;flex:0 0 8px;border-radius:50%;background:var(--task-colour,var(--accent))}
  .recap-card{max-width:576px;width:100%;margin:4px auto 0;border-top:1px solid var(--line);overflow:hidden}
  .recap-content{padding:0 16px 16px;border-top:1px solid var(--line);animation:fadeIn .2s ease}
  .recap-stat{padding:12px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line)}
  .tasks-view-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:5px;border:1px solid var(--line);border-radius:16px;background:var(--panel-2)}
  .tasks-view-tab{min-height:46px;border-radius:12px;color:var(--muted);font-size:.875rem;font-weight:700;transition:background .15s ease,color .15s ease,box-shadow .15s ease}
  .tasks-view-tab.active{background:var(--panel);color:var(--accent);box-shadow:var(--shadow)}
  .sheet-backdrop{position:fixed;inset:0;z-index:70;background:rgba(0,5,15,.66);backdrop-filter:blur(6px)}
  .bottom-sheet{position:absolute;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom));max-height:68dvh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;box-shadow:0 -20px 60px rgba(0,0,0,.38);padding:12px 20px 20px}
  .sheet-handle{width:48px;height:5px;border-radius:999px;background:var(--muted);opacity:.55;margin:0 auto 14px}
  .more-row{width:100%;min-height:72px;display:flex;align-items:center;gap:14px;text-align:left;border-bottom:1px solid var(--line)}
  .more-row:last-child{border-bottom:0}
  .more-accordion{max-width:576px;margin:12px auto 0;border:1px solid var(--line);border-radius:22px;padding:4px 18px;background:var(--panel);animation:fadeIn .25s ease}
  .nested-line{border-left:2px solid color-mix(in srgb,var(--accent) 60%,var(--line));margin-left:20px;padding-left:18px}
  .tag-chip{display:inline-flex;align-items:center;min-height:24px;padding:2px 9px;border:1px solid var(--tag-colour,var(--line));border-radius:999px;color:var(--tag-colour,var(--muted));font-size:11px}
  .secondary-page{max-width:760px;margin:0 auto}.secondary-page-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
  .calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.calendar-day{min-height:88px;padding:8px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.calendar-day.outside{opacity:.38}.calendar-day.today{border-color:var(--accent)}.calendar-day.selected{box-shadow:0 0 0 2px var(--accent);border-color:var(--accent)}.calendar-day-pick{min-width:32px;min-height:32px;border-radius:9px}.calendar-item{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:3px solid var(--item-colour,var(--accent));padding:3px 5px;margin-top:4px;border-radius:4px;background:var(--panel-2);font-size:10px;color:var(--text)}
  .focus-page{min-height:calc(100dvh - 32px);max-width:720px;margin:0 auto;display:flex;flex-direction:column}.focus-page-task{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:12px 0}
  .focus-page .orb:before{inset:-16px}.focus-page .orb:after{inset:-32px}
  .relax-page{min-height:100dvh;display:flex;align-items:center;justify-content:center;text-align:center;position:relative}.relax-page .orb{width:clamp(205px,56vw,320px);height:clamp(205px,56vw,320px)}
  .relax-page .orb:before{inset:-18px;border-color:rgba(75,163,255,.16)}.relax-page .orb:after{inset:-34px;border-color:rgba(119,100,246,.09)}
  .relax-page .orb-stage:before{left:-82%;right:-82%;top:12%;bottom:7%;filter:blur(10px) saturate(1.7)}.relax-page .orb-stage:after{left:-68%;right:-68%;filter:blur(16px) saturate(1.75)}
  .focus-mode .desktop-sidebar,.focus-mode .mobile-bottom-nav,.focus-mode .mobile-top-nav{display:none!important}.focus-mode .app-main{padding-top:0}.focus-mode .safe-bottom:after{display:none}
  .capture-toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.capture-tool{min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:12px;color:var(--muted);background:var(--panel-2)}.capture-tool.active{color:var(--accent);border-color:var(--accent)}
  .quick-task-text{min-height:112px;resize:vertical;line-height:1.5;padding-top:14px;padding-bottom:14px}

  .vault-group{border:1px solid var(--line);border-radius:20px;background:var(--panel);overflow:hidden}.vault-group-header{min-height:58px;padding:12px 16px;border-bottom:1px solid var(--line)}

  .project-chip{display:inline-flex;align-items:center;min-height:25px;padding:2px 9px;border:1px solid var(--project-colour,var(--line));border-radius:999px;color:var(--project-colour,var(--muted));font-size:11px;font-weight:600}
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(53,194,255,.75);outline-offset:3px}
  .hero-grid{background-image:radial-gradient(circle at 50% 27%,rgba(37,185,244,.11),transparent 30%),radial-gradient(circle at 80% 62%,rgba(119,100,246,.09),transparent 26%)}
  /* A real spacer is used instead of relying on padding because Tailwind's
     generated p-* utilities can override padding on mobile. */
  .safe-bottom::after{content:"";display:block;width:100%;height:calc(132px + env(safe-area-inset-bottom));pointer-events:none}
  .mobile-bottom-nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:40;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:22px;padding:7px;display:grid;grid-template-columns:repeat(4,1fr)}

  .app-main{padding-top:64px}
  .task-workspace-card{background:transparent;border:0;box-shadow:none;padding:0!important}
  .order-task-btn{display:none}
  .section-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;min-height:52px}
  @media(min-width:768px){.app-shell{height:100dvh;overflow:hidden}.app-main{height:100dvh;overflow-y:auto;padding-top:0}.mobile-bottom-nav{display:none}.safe-bottom::after{display:none}.desktop-sidebar{display:flex!important;position:sticky;top:0;height:100dvh}.task-workspace-card{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);padding:1.25rem!important}.order-task-btn{display:inline-flex}.fab{right:36px;bottom:30px}.bottom-sheet{left:50%;right:auto;bottom:24px;width:min(620px,calc(100% - 48px));transform:translateX(-50%);border-bottom:1px solid var(--line);border-radius:28px}.focus-home{min-height:calc(100dvh - 130px)}}

function attachLockHandlers() {
  document.getElementById("backToLanding").addEventListener("click", function () { state.screen = "landing"; render(); });
  document.getElementById("authThemeToggle").addEventListener("click", toggleTheme);
  var modeBtns = document.querySelectorAll(".auth-mode-btn");
  for (var i = 0; i < modeBtns.length; i++) {
    modeBtns[i].addEventListener("click", function (e) {
      state.authMode = e.currentTarget.getAttribute("data-mode");
      render();
    });
  }

  var form = document.getElementById("authForm");
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var email = document.getElementById("authEmail").value.trim();
    var password = document.getElementById("authPassword").value;
    var msgBox = document.getElementById("authMessage");
    var submitBtn = document.getElementById("authSubmitBtn");
    msgBox.innerHTML = "";
    state.authNotice = "";
    if (!email || !password) {
      msgBox.innerHTML = '<div class="rounded-lg px-3 py-2.5 text-xs mb-2" style="background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.25);color:#fca5a5;">Enter both an email and a password.</div>';
      return;
    }
    submitBtn.disabled = true;
    submitBtn.textContent = "Please wait...";

    var authPromise = state.authMode === "signin"
      ? sb.auth.signInWithPassword({ email: email, password: password })
      : sb.auth.signUp({ email: email, password: password });

    authPromise.then(function (result) {
      if (result.error) throw result.error;
      var data = result.data;
      if (data.session) {
        state.session = data.session;
        state.screen = "loading";
        render();
        loadCloudData();

        state.authNotice = "Account created - check your email to confirm, then sign in.";

        submitBtn.disabled = false;
        submitBtn.textContent = "Sign in";
      }

      msgBox.innerHTML = '<div class="rounded-lg px-3 py-2.5 text-xs mb-2" style="background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.25);color:#fca5a5;">' + escapeHtml(err.message || "Something went wrong.") + '</div>';
      submitBtn.disabled = false;
      submitBtn.textContent = state.authMode === "signin" ? "Sign in" : "Create account";
    });
  });
}

/* ============================================================
   AUTH LIFECYCLE
============================================================ */
function initAuth() {
  if (!isSupabaseConfigured() || !sb) { render(); return; }
  sb.auth.getSession().then(function (result) {
    state.session = result.data.session;
    if (state.session) { state.screen = "loading"; render(); loadCloudData(); }
    else { state.screen = "landing"; render(); }
  }).catch(function () {
    state.screen = "landing";
    render();
  });

  sb.auth.onAuthStateChange(function (_event, session) {
    state.session = session;
    if (!session) {
      state.cloud = null;
      state.screen = "landing";
      render();
    }
  });
}

function signOut() {
  sb.auth.signOut().then(function () {
    state.cloud = null;
    state.screen = "landing";
    render();
  });
}

/* ============================================================
   CLOUD DATA LOAD / SAVE
============================================================ */
function loadCloudData() {
  var userId = state.session.user.id;
  sb.from("focusos_state").select("*").eq("user_id", userId).maybeSingle().then(function (result) {
    if (result.error) throw result.error;
    var row = result.data;
    if (!row) {
      var defaultRow = {
        user_id: userId, xp: 0,
        habits: { date: todayStr(), values: {} },
        tasks: DEFAULT_TASKS,
        docs: [],
        workspace: defaultWorkspace(),
        connections: { gmail: {}, drive: {}, whatsapp: {}, zoho: {}, jotform: {}, _preferences: { theme: state.theme } }
      };
      return sb.from("focusos_state").insert(defaultRow).then(function (insertResult) {
        if (insertResult.error) throw insertResult.error;
        state.cloud = defaultRow;
        return enterConsole();
      });
    } else {
      state.cloud = row;
      state.cloud.workspace = normalizeWorkspace(row.workspace);
      if (row.connections && row.connections._preferences && row.connections._preferences.theme) {
        state.theme = row.connections._preferences.theme;
        applyTheme();
      }
      return enterConsole();
    }
  }).catch(function (err) {
    state.syncStatus = "error";
    state.screen = "console";
    state.cloud = state.cloud || {
      xp: 0, habits: { date: todayStr(), values: {} }, tasks: DEFAULT_TASKS, docs: [],
      workspace: defaultWorkspace(),
      connections: { gmail: {}, drive: {}, whatsapp: {}, zoho: {}, jotform: {}, _preferences: { theme: state.theme } }
    };
    render();
    showToast("Could not load cloud data: " + (err.message || "unknown error"));
  });
}

function loadCanonicalData() {
  var userId = state.session && state.session.user ? state.session.user.id : '';
  return Promise.all([
    sb.from("focusos_tasks").select("id,title,priority,status,project_id,goal_id,scheduled_date,scheduled_time,is_daily_anchor,recurrence,sort_order,source,completed_at,created_at,updated_at").eq("user_id", userId).order("sort_order", { ascending: true }).order("created_at", { ascending: true }),
    sb.from("focusos_projects").select("id,name,colour,status,created_at,updated_at").eq("user_id", userId).eq("status", "active").order("created_at", { ascending: true }),
    sb.from("focusos_goals").select("id,project_id,title,why_this_matters,status,sort_order,created_at,updated_at").eq("user_id", userId).eq("status", "active").order("sort_order", { ascending: true }).order("created_at", { ascending: true }),
    sb.from("focusos_tags").select("id,name,colour,created_at,updated_at").eq("user_id", userId).order("name", { ascending: true }),
    sb.from("focusos_task_tags").select("task_id,tag_id").eq("user_id", userId)
  ]).then(function (results) {
    if (results[0].error) throw results[0].error;
    if (results[1].error) throw results[1].error;
    if (results[2].error) throw results[2].error;
    if (results[3].error) throw results[3].error;
    if (results[4].error) throw results[4].error;
    state.tasks = results[0].data || [];
    state.projects = results[1].data || [];
    state.goals = results[2].data || [];
    state.tags = results[3].data || [];
    state.taskTags = results[4].data || [];
    state.projects.forEach(function (project) { if (state.projectExpanded[project.id] === undefined) state.projectExpanded[project.id] = true; });
    if (state.projectExpanded.none === undefined) state.projectExpanded.none = true;
  });
}

/* ============================================================
   GOOGLE WORKSPACE - SECURE OAUTH VIA SUPABASE EDGE FUNCTION
============================================================ */
function googleRequest(path, method) {
  if (!state.session || !state.session.access_token) return Promise.reject(new Error("Sign in required."));
  return fetch(GOOGLE_WORKSPACE_FUNCTION + path, {
    method: method || "GET",
    headers: { Authorization: "Bearer " + state.session.access_token, "Content-Type": "application/json" }
  }).then(function (response) {
    return response.json().catch(function () { return {}; }).then(function (body) {
      if (!response.ok) throw new Error(body.error || "Google Workspace request failed.");
      return body;
    });
  });
}

function loadGoogleWorkspaceData(force) {
  if (state.googleLoading || !state.session) return;
  if (!force && state.google.status === "connected" && state.liveData.gmail && state.liveData.calendar && state.liveData.googleTasks) return;
  state.googleLoading = true;
  state.google.status = "checking";
  googleRequest("/data", "GET").then(function (data) {
    state.google.connected = !!data.connected;
    state.google.status = data.connected ? "connected" : "disconnected";
    state.google.email = data.email || "moktar@progressay.com";
    state.google.unread = data.gmail ? Number(data.gmail.unread || 0) : 0;
    state.google.error = "";
    state.liveData.gmail = data.gmail && Array.isArray(data.gmail.messages) ? data.gmail.messages : [];
    state.liveData.calendar = data.calendar && Array.isArray(data.calendar.events) ? data.calendar.events : [];
    state.liveData.googleTasks = data.tasks && Array.isArray(data.tasks.items) ? data.tasks.items : [];
    state.liveData.drive = data.drive && Array.isArray(data.drive.files) ? data.drive.files.map(function (file) {
      var type = file.mimeType && file.mimeType.indexOf("folder") !== -1 ? "Folder" : file.mimeType && file.mimeType.indexOf("document") !== -1 ? "Google Doc" : file.mimeType && file.mimeType.indexOf("spreadsheet") !== -1 ? "Google Sheet" : file.mimeType && file.mimeType.indexOf("presentation") !== -1 ? "Google Slides" : "Drive file";
      var size = file.size === null || file.size === undefined ? "Size unavailable" : file.size < 1024 * 1024 ? Math.max(1, Math.round(file.size / 1024)) + " KB" : (file.size / 1024 / 1024).toFixed(1) + " MB";
      return { id: file.id, name: file.name, tag: type, date: file.modifiedTime ? new Date(file.modifiedTime).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "", size: size, link: file.link, starred: !!file.starred, drive: true };
    }) : [];
    recordInboxZeroDay();
  }).catch(function (error) {
    state.google.connected = false;
    state.google.status = error.message.indexOf("setup is incomplete") !== -1 ? "setup" : "error";
    state.google.error = error.message;
    state.liveData.gmail = [];
    state.liveData.calendar = [];
    state.liveData.drive = [];
    state.liveData.googleTasks = [];
  }).finally(function () {
    state.googleLoading = false;
    if (state.screen === "console") render();
    var params = new URLSearchParams(window.location.search);
    if (params.get("google") === "connected") showToast("Google Workspace connected.");
    if (params.get("google") === "denied") showToast("Google connection was cancelled.");
    if (params.get("google") === "error") showToast(params.get("message") || "Google connection failed.");
    if (params.has("google")) window.history.replaceState({}, document.title, window.location.pathname);
  });
}

function connectGoogleWorkspace() {
  var button = document.getElementById("connectGoogleBtn");
  if (button) { button.disabled = true; button.textContent = "Opening Google..."; }
  googleRequest("/start", "POST").then(function (data) {
    if (!data.url) throw new Error("Google did not return an authorisation URL.");
    window.location.assign(data.url);
  }).catch(function (error) {
    state.google.status = error.message.indexOf("setup is incomplete") !== -1 ? "setup" : "error";
    state.google.error = error.message;
    render();
    showToast(error.message);
  });
}

function disconnectGoogleWorkspace() {
  if (!window.confirm("Disconnect Google Workspace from FocusOS?")) return;
  googleRequest("/disconnect", "POST").then(function () {
    state.google = { status: "disconnected", connected: false, email: "moktar@progressay.com", unread: 0, error: "" };
    state.liveData.gmail = [];
    state.liveData.calendar = [];
    state.liveData.drive = [];
    state.liveData.googleTasks = [];
    render();
    showToast("Google Workspace disconnected.");
  }).catch(function (error) { showToast(error.message); });
}

      xp: c.xp, habits: c.habits, tasks: c.tasks, docs: c.docs, connections: c.connections, workspace: c.workspace, updated_at: new Date().toISOString()
    }).eq("user_id", state.session.user.id).then(function (result) {
      state.syncStatus = result.error ? "error" : "saved";
      updateSyncPill();
    }).catch(function () {
      state.syncStatus = "error";

function homeWelcomeMessage() {
  var user = state.session && state.session.user ? state.session.user : {};
  var metadata = user.user_metadata || {};
  var raw = metadata.first_name || metadata.full_name || metadata.name || String(user.email || '').split('@')[0] || '';
  var first = String(raw).trim().split(/\s+/)[0];
  var hour = new Date().getHours();
  var greeting = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
  if (!first) return greeting;
  return greeting + ', ' + first.charAt(0).toUpperCase() + first.slice(1);

function homeTaskSort(a, b) {
  if (a.status !== b.status) return a.status === 'completed' ? 1 : -1;
  var at = a.scheduled_time ? String(a.scheduled_time).slice(0,5) : '99:99';
  var bt = b.scheduled_time ? String(b.scheduled_time).slice(0,5) : '99:99';
  return at.localeCompare(bt) || Number(a.sort_order || 0) - Number(b.sort_order || 0);
}

function renderHomeAgenda(tasks) {

function completedDate(task) {

}

function renderRecapCard() {
  var now = new Date();

  var weekStart = new Date(now); weekStart.setDate(now.getDate() - 6); weekStart.setHours(0,0,0,0);
  var completed = state.tasks.filter(function (task) { return task.status === 'completed' && completedDate(task); });
  var yesterdayTasks = completed.filter(function (task) { return localDay(completedDate(task)) === localDay(yesterday); });
  var weekTasks = completed.filter(function (task) { return completedDate(task) >= weekStart; });
  var details = '';
  if (state.recapOpen) {
    details = '<div id="recapContent" class="recap-content"><div class="grid grid-cols-2 gap-3 mt-4"><div class="recap-stat"><strong class="theme-text text-xl block">' + yesterdayTasks.length + '</strong><small class="muted-text">Yesterday</small></div><div class="recap-stat"><strong class="theme-text text-xl block">' + weekTasks.length + '</strong><small class="muted-text">Last 7 days</small></div></div>' + (weekTasks.length ? '<div class="mt-3">' + weekTasks.slice(0,3).map(function (task) { return '<button data-edit-task="' + task.id + '" class="w-full flex items-center gap-3 py-3 text-left border-b" style="border-color:var(--line)" aria-label="Open completed task ' + escapeHtml(task.title) + '"><span style="color:var(--emerald)">✓</span><span class="theme-text text-sm flex-1">' + escapeHtml(task.title) + '</span><span style="color:var(--accent)">›</span></button>'; }).join('') + (weekTasks.length > 3 ? '<button data-dashboard-panel="progress" class="min-h-[48px] text-sm font-semibold" style="color:var(--accent)">View full recap</button>' : '') + '</div>' : '<p class="muted-text text-sm mt-3">No completed tasks recorded in the last 7 days.</p>') + '</div>';
  }

function nextTaskCandidates() {
  var priorityRank = { red: 0, blue: 1, yellow: 1, green: 1 };
  return state.tasks.filter(function (task) { return task.status === 'open'; }).slice().sort(function (a,b) {
    var aToday = a.scheduled_date === localDay() ? 0 : 1, bToday = b.scheduled_date === localDay() ? 0 : 1;
    if (aToday !== bToday) return aToday - bToday;
    var ap = Object.prototype.hasOwnProperty.call(priorityRank,a.priority) ? priorityRank[a.priority] : 3;
    var bp = Object.prototype.hasOwnProperty.call(priorityRank,b.priority) ? priorityRank[b.priority] : 3;
    if (ap !== bp) return ap - bp;
    return Number(a.sort_order || 0) - Number(b.sort_order || 0);
  });
}
function nextTaskReason(task) { return (task.scheduled_date === localDay() ? 'scheduled for today and ' : '') + (task.priority === 'red' ? 'marked critical' : task.priority === 'yellow' ? 'marked for today' : task.priority === 'green' ? 'the next routine task' : 'first in your task order'); }
function renderProjectChip(task) { var project = state.projects.find(function (item) { return item.id === task.project_id; }); return project ? '<span class="project-chip" style="--project-colour:' + projectColour(project.id,task.priority) + '">▣ ' + escapeHtml(project.name) + '</span>' : '<span class="project-chip">Inbox</span>'; }

    '<button data-dashboard-panel="calendar" class="more-row"><span class="text-xl" style="color:var(--accent)">▣</span><span class="flex-1"><strong class="theme-text block">Calendar &amp; timeline</strong><small class="muted-text">Dates, times and upcoming events</small></span><span style="color:var(--accent)">›</span></button>' +
    '<button data-dashboard-panel="projects" class="more-row"><span class="text-xl" style="color:var(--accent)">□</span><span class="flex-1"><strong class="theme-text block">Projects</strong><small class="muted-text">The same tasks grouped inside folders</small></span><span style="color:var(--accent)">›</span></button>' +
    '<button data-dashboard-panel="progress" class="more-row"><span class="text-xl" style="color:var(--accent)">◔</span><span class="flex-1"><strong class="theme-text block">Progress &amp; activity</strong><small class="muted-text">Completed work and recent changes</small></span><span style="color:var(--accent)">›</span></button>' +
    '<button id="openGoogleFromMore" class="more-row"><span class="text-xl" aria-hidden="true">G</span><span class="flex-1"><strong class="theme-text block">Google Workspace</strong><small class="muted-text">Calendar · Gmail · Tasks · Drive</small></span><small style="color:' + (state.google.connected ? 'var(--emerald)' : 'var(--accent)') + '">' + (state.google.connected ? googleStatus : 'Connect') + '</small><span style="color:var(--accent)">›</span></button>' +
  '</section>';

function renderTaskCreateSheet() {

}

function renderCalendarTimelinePanel() {
  var cursor = new Date(state.calendarCursor); cursor.setDate(1); cursor.setHours(12,0,0,0);
  var gridStart = new Date(cursor); gridStart.setDate(1 - ((cursor.getDay() + 6) % 7));
  var monthKey = localDay(cursor).slice(0,7);
  var weekdays = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(function (day) { return '<div class="calendar-weekday muted-text text-center text-[11px] font-semibold py-1">' + day + '</div>'; }).join('');
  var events = state.google.connected ? (state.liveData.calendar || []) : [];
  var externalTasks = state.google.connected ? (state.liveData.googleTasks || []) : [];
  var cells = [];
  for (var i = 0; i < 42; i++) {
    var date = new Date(gridStart); date.setDate(gridStart.getDate() + i);
    var key = localDay(date);
    var tasks = state.tasks.filter(function (task) { return task.status === 'open' && task.scheduled_date === key; });
    var dayEvents = events.filter(function (event) { return event.start && localDay(new Date(event.start)) === key; });
    var googleDayTasks = externalTasks.filter(function (task) { return task.due && String(task.due).slice(0,10) === key; });
    var items = tasks.slice(0,2).map(function (task) { return '<button data-edit-task="' + task.id + '" class="calendar-item w-full text-left" style="--item-colour:' + projectColour(task.project_id, task.priority) + '" title="Open ' + escapeHtml(task.title) + '">' + escapeHtml(task.scheduled_time ? String(task.scheduled_time).slice(0,5) + ' ' + task.title : task.title) + '</button>'; }).join('');
    items += dayEvents.slice(0,2).map(function (event) { return '<a class="calendar-item" style="--item-colour:var(--accent-2)" href="' + escapeHtml(safeExternalUrl(event.link)) + '" target="_blank" rel="noopener" title="' + escapeHtml(event.title) + '">' + escapeHtml(event.title) + '</a>'; }).join('');
    if (tasks.length + dayEvents.length < 4) items += googleDayTasks.slice(0,1).map(function (task) { return '<a class="calendar-item" style="--item-colour:var(--warning)" href="' + escapeHtml(safeExternalUrl(task.link)) + '" target="_blank" rel="noopener" title="Google Task: ' + escapeHtml(task.title) + '">' + escapeHtml(task.title) + '</a>'; }).join('');
    var total = tasks.length + dayEvents.length + googleDayTasks.length;
    var hidden = Math.max(0, total - 4);
    cells.push('<div class="calendar-day ' + (key.slice(0,7) !== monthKey ? 'outside ' : '') + (key === localDay() ? 'today ' : '') + (key === state.calendarSelectedDate ? 'selected' : '') + '"><div class="flex items-center justify-between"><button data-calendar-day="' + key + '" class="calendar-day-pick theme-text text-xs font-semibold" aria-label="Show agenda for ' + date.toLocaleDateString('en-GB') + '">' + date.getDate() + '</button>' + (total ? '<span class="muted-text text-[9px]">' + total + '</span>' : '') + '</div>' + items + (hidden > 0 ? '<button data-calendar-day="' + key + '" class="muted-text text-[9px] min-h-[30px]">+' + hidden + ' more</button>' : '') + '</div>');
  }
  var selectedTasks = state.tasks.filter(function (task) { return task.status === 'open' && task.scheduled_date === state.calendarSelectedDate; }).sort(function(a,b){ return String(a.scheduled_time || '99:99').localeCompare(String(b.scheduled_time || '99:99')); });
  var selectedEvents = events.filter(function(event){ return event.start && localDay(new Date(event.start)) === state.calendarSelectedDate; });
  var selectedDate = new Date(state.calendarSelectedDate + 'T12:00:00');
  var agenda = '<section class="card p-4 sm:p-5 mt-4"><div class="flex items-center justify-between mb-3"><h3 class="theme-text font-bold">' + selectedDate.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'}) + '</h3><button id="addOnSelectedDay" class="btn-ghost rounded-xl min-h-[44px] px-3">+ Task</button></div>' + (selectedTasks.length ? renderCanonicalTaskList(selectedTasks) : '<p class="muted-text text-sm py-2">No FocusOS tasks on this day.</p>') + selectedEvents.map(function(event){ return '<a class="more-row" href="' + escapeHtml(safeExternalUrl(event.link)) + '" target="_blank" rel="noopener"><span style="color:var(--accent-2)">●</span><span class="flex-1"><strong class="theme-text block text-sm">' + escapeHtml(event.title) + '</strong><small class="muted-text">Google Calendar</small></span><span>↗</span></a>'; }).join('') + '</section>';
  return '<div class="card p-3 sm:p-5"><div class="flex items-center justify-between mb-4"><button id="calendarPrev" class="btn-ghost min-w-[44px] min-h-[44px] rounded-xl" aria-label="Previous month">‹</button><h2 class="theme-text text-lg font-bold">' + cursor.toLocaleDateString('en-GB',{month:'long',year:'numeric'}) + '</h2><button id="calendarNext" class="btn-ghost min-w-[44px] min-h-[44px] rounded-xl" aria-label="Next month">›</button></div><div class="calendar-grid mb-2">' + weekdays + cells.join('') + '</div><div class="flex flex-wrap gap-4 mt-4 text-xs muted-text"><span><b style="color:var(--accent)">●</b> FocusOS</span><span><b style="color:var(--accent-2)">●</b> Calendar</span><span><b style="color:var(--warning)">●</b> Google Tasks</span></div>' + (!state.google.connected ? '<button id="connectGoogleCalendar" class="btn-primary w-full min-h-[48px] rounded-xl mt-4">Connect Google Workspace</button>' : '') + '</div>' + agenda;
}

function projectColour(projectId, priority) {

function taskMatchesView(task) {
  if (state.projectFilter === 'none' && task.project_id) return false;
  if (state.projectFilter !== 'all' && state.projectFilter !== 'none' && task.project_id !== state.projectFilter) return false;
  if (state.tagFilter !== 'all' && !state.taskTags.some(function (link) { return link.task_id === task.id && link.tag_id === state.tagFilter; })) return false;
  if (state.taskView === 'completed') return task.status === 'completed';
  if (task.status !== 'open') return false;
  if (state.taskView === 'today') return task.scheduled_date === localDay();
  if (state.taskView === 'timeline') return !!task.scheduled_date;
  if (state.taskView === 'anchors') return !!task.is_daily_anchor;
  return true;
}

function renderTaskWorkspace() {
  var primaryViews = [['today','Today'],['priority','Priority'],['all','All']];
  var secondaryViews = [['timeline','Timeline'],['anchors','Anchors'],['completed','Completed']];
  var filtered = state.tasks.filter(taskMatchesView);
  if (state.taskView === 'timeline') filtered.sort(function (a,b) { return String(a.scheduled_date || '').localeCompare(String(b.scheduled_date || '')) || String(a.scheduled_time || '').localeCompare(String(b.scheduled_time || '')); });
  if (state.taskView === 'priority') {
    var priorityRank = { red: 0, blue: 1, yellow: 1, green: 1 };
    filtered.sort(function (a, b) {
      var aRank = Object.prototype.hasOwnProperty.call(priorityRank, a.priority) ? priorityRank[a.priority] : 3;
      var bRank = Object.prototype.hasOwnProperty.call(priorityRank, b.priority) ? priorityRank[b.priority] : 3;
      return aRank - bRank || Number(a.sort_order || 0) - Number(b.sort_order || 0);
    });
  }
  var detailViewActive = secondaryViews.some(function (view) { return state.taskView === view[0]; }) || state.projectFilter !== 'all';
  var detailsOpen = state.taskFiltersExpanded || detailViewActive;
  var tabHtml = function (view) { return '<button data-task-view="' + view[0] + '" class="task-view-btn rounded-full px-4 py-2.5 text-sm font-semibold" style="background:' + (state.taskView === view[0] ? 'rgba(37,185,244,.14)' : 'var(--panel-2)') + ';color:' + (state.taskView === view[0] ? 'var(--accent)' : 'var(--muted)') + '">' + view[1] + '</button>'; };
  var primaryTabs = primaryViews.map(tabHtml).join('');
  var secondaryTabs = secondaryViews.map(tabHtml).join('');
  var projectSelect = '<select id="projectFilter" class="rounded-xl px-3 min-h-[44px] text-sm"><option value="all">All projects</option><option value="none" ' + (state.projectFilter === 'none' ? 'selected' : '') + '>No Project / Inbox</option>' + state.projects.map(function (project) { return '<option value="' + project.id + '" ' + (state.projectFilter === project.id ? 'selected' : '') + '>' + escapeHtml(project.name) + '</option>'; }).join('') + '</select>';
  var visible = state.taskListExpanded ? filtered : filtered.slice(0, 4);
  var remaining = filtered.length - visible.length;
  var moreTasks = remaining > 0 ? '<button id="showMoreTasksBtn" class="btn-ghost w-full rounded-xl min-h-[48px] mt-3 text-sm">Show ' + remaining + ' more task' + (remaining === 1 ? '' : 's') + '</button>' : (state.taskListExpanded && filtered.length > 4 ? '<button id="showFewerTasksBtn" class="btn-ghost w-full rounded-xl min-h-[48px] mt-3 text-sm">Show fewer</button>' : '');
  var taskListHtml = state.taskView === 'priority' ? '<div class="mb-5"><h4 class="text-sm font-semibold mb-2" style="color:var(--danger)">1. Priority</h4>' + renderCanonicalTaskList(filtered.filter(function (task) { return task.priority === 'red'; })) + '</div><div><h4 class="text-sm font-semibold mb-2" style="color:var(--accent)">2. Not priority</h4>' + renderCanonicalTaskList(filtered.filter(function (task) { return task.priority !== 'red'; })) + '</div>' : renderCanonicalTaskList(visible);
  return '<div class="flex items-center justify-between gap-3 mb-4"><div><h3 class="theme-text font-semibold">Tasks</h3><p class="muted-text text-xs mt-1">' + filtered.length + ' in this view</p></div><button id="toggleTaskFiltersBtn" class="btn-ghost rounded-xl px-3 min-h-[44px] text-sm" aria-expanded="' + detailsOpen + '">' + (detailsOpen ? 'Fewer views' : 'More views') + '</button></div>' +
    '<div class="grid grid-cols-3 gap-2 mb-4">' + primaryTabs + '</div>' +
    (detailsOpen ? '<div class="rounded-2xl p-3 mb-4" style="background:var(--panel);border:1px solid var(--line)"><div class="flex flex-wrap gap-2 mb-3">' + secondaryTabs + '</div><label class="muted-text text-xs block mb-2" for="projectFilter">Project</label>' + projectSelect + '</div>' : '') +
    '<div id="canonicalTaskList">' + taskListHtml + '</div>' + (state.taskView === 'priority' ? '' : moreTasks);
}

function renderCanonicalTaskList(tasks) {
  if (!tasks.length) return '<div class="rounded-xl p-5 text-center" style="background:var(--panel-2);border:1px solid var(--line)"><p class="theme-text text-sm font-semibold">Nothing in this view</p><p class="muted-text text-xs mt-1">Tasks appear here from the same master list.</p></div>';
  return tasks.map(function (task, index) {
    var meta = [task.scheduled_date || '', task.scheduled_time ? String(task.scheduled_time).slice(0,5) : ''].filter(Boolean).join(' · ');
    var done = task.status === 'completed';
    return '<div class="task-card flex items-center gap-2 px-3 py-3 mb-2" style="border-left:4px solid ' + projectColour(task.project_id,task.priority) + '"><button data-complete-task="' + task.id + '" class="complete-task-btn p-2" style="color:' + (done ? 'var(--emerald)' : 'var(--text)') + '" aria-label="' + (done ? 'Reopen task' : 'Complete task') + '">' + (done ? '✓' : '○') + '</button><button data-edit-task="' + task.id + '" class="flex-1 text-left min-h-[44px]" aria-label="Open and edit ' + escapeHtml(task.title) + '"><p class="theme-text text-sm font-semibold ' + (done ? 'checked-item' : '') + '">' + escapeHtml(task.title) + '</p><div class="flex flex-wrap items-center gap-2 mt-2">' + renderProjectChip(task) + '<span class="tag-chip" style="--tag-colour:' + projectColour(null,task.priority) + '">' + (task.priority === 'red' ? 'PRIORITY' : 'NOT PRIORITY') + '</span>' + renderTaskTags(task.id) + (meta ? '<span class="muted-text text-xs">' + escapeHtml(meta) + '</span>' : '') + '</div></button>' + (!done ? '<button data-flow-task="' + task.id + '" class="task-action" aria-label="Start focus on ' + escapeHtml(task.title) + '" title="Start focus">▶</button>' : '') + '<button data-order-task="' + task.id + ':-1" class="order-task-btn muted-text p-2" ' + (index === 0 ? 'disabled' : '') + '>↑</button><button data-order-task="' + task.id + ':1" class="order-task-btn muted-text p-2" ' + (index === tasks.length - 1 ? 'disabled' : '') + '>↓</button></div>';
  }).join('');
}

function renderProjectManager() {
  var rows = state.projects.map(function (project) { var count = state.tasks.filter(function (task) { return task.project_id === project.id && task.status === 'open'; }).length; return '<div class="rounded-xl p-3 mb-2 flex items-center gap-2" style="background:var(--panel-2);border:1px solid var(--line)"><button class="filter-project-btn flex-1 text-left" data-id="' + project.id + '"><p class="theme-text text-sm font-semibold">' + escapeHtml(project.name) + '</p><p class="muted-text text-xs">' + count + ' open task' + (count === 1 ? '' : 's') + '</p></button><button class="rename-project-btn muted-text p-2" data-id="' + project.id + '">✎</button><button class="delete-project-btn muted-text p-2" data-id="' + project.id + '">×</button></div>'; }).join('');
  return (rows || '<p class="muted-text text-sm mb-3">No projects yet. Tasks can remain in your Inbox.</p>') + '<form id="projectForm" class="flex gap-2"><input name="name" required class="rounded-xl px-3 min-h-[46px] flex-1" placeholder="New project name"><button class="btn-primary rounded-xl px-4">Create</button></form>';
}

function renderNestedProjects() {
  if (state.selectedGoalId) return renderSelectedGoal();
  if (state.selectedProjectId) return renderProjectGoals();
  var query = state.projectQuery.toLowerCase().trim();
  var projects = state.projects.filter(function (project) { return !query || project.name.toLowerCase().indexOf(query) !== -1; });
  var rows = projects.map(function (project) {
    var tasks = state.tasks.filter(function (task) { return task.project_id === project.id && task.status !== 'archived'; });
    var completed = tasks.filter(function (task) { return task.status === 'completed'; }).length;
    var open = tasks.filter(function (task) { return task.status === 'open'; }).sort(homeTaskSort);
    var percent = tasks.length ? Math.round(completed / tasks.length * 100) : 0;
    var colour = /^#[0-9a-f]{6}$/i.test(project.colour || '') ? project.colour : 'var(--accent)';
    return '<button data-open-project="' + project.id + '" class="w-full py-4 flex items-center gap-3 text-left border-b" style="border-color:var(--line)"><span class="w-3 h-3 rounded-full shrink-0" style="background:' + colour + '"></span><span class="flex-1 min-w-0"><span class="flex items-center justify-between gap-3"><strong class="theme-text">' + escapeHtml(project.name) + '</strong><b class="theme-text text-sm">' + percent + '%</b></span><small class="muted-text block mt-1">' + completed + ' of ' + tasks.length + ' tasks complete</small><span class="block h-1 rounded-full mt-2 overflow-hidden" style="background:var(--soft)"><span class="block h-full rounded-full" style="width:' + percent + '%;background:' + colour + '"></span></span>' + (open[0] ? '<small class="muted-text block mt-2 truncate">Next: ' + escapeHtml(open[0].title) + '</small>' : '') + '</span><span style="color:' + colour + '">›</span></button>';
  }).join('');
  return '<div class="flex gap-2 mb-5"><input id="projectSearch" value="' + escapeHtml(state.projectQuery) + '" class="min-w-0 flex-1 rounded-xl px-4 min-h-[48px]" placeholder="Search projects"><button id="toggleProjectCreate" class="btn-primary rounded-xl min-h-[48px] px-4">+ Project</button></div>' + (state.openSections.projects ? '<form id="projectQuickForm" class="flex gap-2 mb-4"><input name="name" required maxlength="60" class="rounded-xl px-3 min-h-[48px] flex-1" placeholder="Project name"><input name="colour" type="color" value="#7764f6" class="rounded-xl w-12 min-h-[48px] p-1" aria-label="Project colour"><button class="btn-primary rounded-xl px-4">Save</button></form>' : '') + '<div>' + (rows || '<p class="muted-text text-sm py-8 text-center">No projects match your search.</p>') + '</div>';
}

function renderProjectGoals() {
  var project = state.projects.find(function (item) { return item.id === state.selectedProjectId; });
  if (!project) { state.selectedProjectId = null; return renderNestedProjects(); }
  var tasks = state.tasks.filter(function (task) { return task.project_id === project.id && task.status !== 'archived'; });
  var completed = tasks.filter(function (task) { return task.status === 'completed'; }).length;
  var percent = tasks.length ? Math.round(completed / tasks.length * 100) : 0;
  var goals = state.goals.filter(function (goal) { return goal.project_id === project.id; });
  var editingGoal = state.editingGoalId ? state.goals.find(function (goal) { return goal.id === state.editingGoalId; }) : null;
  var rows = goals.map(function (goal) {
    var goalTasks = tasks.filter(function (task) { return task.goal_id === goal.id; });
    var goalCompleted = goalTasks.filter(function (task) { return task.status === 'completed'; }).length;
    return '<button data-open-goal="' + goal.id + '" class="w-full min-h-[72px] py-3 flex items-center gap-3 text-left border-b" style="border-color:var(--line)"><span class="w-3 h-3 rounded-full" style="background:var(--accent-2)"></span><span class="flex-1 min-w-0"><strong class="theme-text block">' + escapeHtml(goal.title) + '</strong><small class="muted-text block truncate mt-1">' + escapeHtml(goal.why_this_matters || 'Add why this goal matters') + '</small></span><small class="theme-text">' + goalCompleted + ' of ' + goalTasks.length + '</small><span style="color:var(--accent)">›</span></button>';
  }).join('');
  var withoutGoal = tasks.filter(function (task) { return !task.goal_id; }).length;
  var form = state.goalEditorOpen ? '<form id="goalForm" class="mt-4 p-4 rounded-2xl" style="background:var(--panel-2)"><label class="muted-text text-xs block">Goal<input name="title" required maxlength="120" value="' + escapeHtml(editingGoal ? editingGoal.title : '') + '" class="w-full rounded-xl px-3 min-h-[48px] mt-1" placeholder="What do you want to achieve?"></label><label class="muted-text text-xs block mt-3">Why this matters<textarea name="why" rows="3" class="w-full rounded-xl px-3 py-3 mt-1" placeholder="Why is this important?">' + escapeHtml(editingGoal ? editingGoal.why_this_matters || '' : '') + '</textarea></label><div class="flex gap-2 mt-3"><button class="btn-primary rounded-xl min-h-[48px] px-4 flex-1">' + (editingGoal ? 'Save changes' : 'Save goal') + '</button><button type="button" id="cancelGoalForm" class="btn-ghost rounded-xl min-h-[48px] px-4">Cancel</button></div></form>' : '';
  return '<div class="flex items-center gap-3 mb-5"><button id="backToProjects" class="min-w-[44px] min-h-[44px] text-2xl" aria-label="Back to Projects">‹</button><div class="flex-1"><h2 class="theme-text text-2xl font-bold">' + escapeHtml(project.name) + '</h2><p class="muted-text text-sm">' + completed + ' of ' + tasks.length + ' tasks complete</p></div><strong class="theme-text text-xl">' + percent + '%</strong></div><div class="h-2 rounded-full overflow-hidden mb-5" style="background:var(--soft)"><div class="h-full rounded-full" style="width:' + percent + '%;background:linear-gradient(90deg,var(--accent),var(--accent-2))"></div></div><button id="openGoalForm" class="btn-primary w-full min-h-[50px] rounded-xl">+ Add goal</button>' + form + '<h3 class="theme-text font-bold mt-6 mb-2">Goals</h3><div>' + (rows || '<p class="muted-text text-sm py-4">No goals yet. Add one to explain what this project is working towards.</p>') + '</div><button data-open-goal="none" class="w-full min-h-[62px] flex items-center gap-3 text-left border-t" style="border-color:var(--line)"><span aria-hidden="true">☷</span><strong class="theme-text flex-1">Tasks without a goal</strong><small class="muted-text">' + withoutGoal + '</small><span style="color:var(--accent)">›</span></button>';
}

function renderSelectedGoal() {
  var project = state.projects.find(function (item) { return item.id === state.selectedProjectId; });
  var noGoal = state.selectedGoalId === 'none';
  var goal = noGoal ? null : state.goals.find(function (item) { return item.id === state.selectedGoalId; });
  if (!project || (!noGoal && !goal)) { state.selectedGoalId = null; return renderProjectGoals(); }
  var tasks = state.tasks.filter(function (task) { return task.project_id === project.id && task.status !== 'archived' && (noGoal ? !task.goal_id : task.goal_id === goal.id); }).sort(homeTaskSort);
  var completed = tasks.filter(function (task) { return task.status === 'completed'; }).length;
  var percent = tasks.length ? Math.round(completed / tasks.length * 100) : 0;
  var taskRows = tasks.map(function (task) { return renderHomeTaskRow(task, false); }).join('');
  var why = noGoal ? '' : '<section class="py-4 border-y" style="border-color:var(--line)"><h3 class="theme-text font-bold">Why this matters</h3><p class="muted-text text-sm mt-2 leading-relaxed">' + escapeHtml(goal.why_this_matters || 'No explanation added yet.') + '</p></section>';
  return '<div class="flex items-center gap-3 mb-5"><button id="backToProjectGoals" class="min-w-[44px] min-h-[44px] text-2xl" aria-label="Back to project">‹</button><div class="flex-1"><p class="muted-text text-xs">' + escapeHtml(project.name) + '</p><h2 class="theme-text text-2xl font-bold">' + escapeHtml(noGoal ? 'Tasks without a goal' : goal.title) + '</h2><p class="muted-text text-sm">' + completed + ' of ' + tasks.length + ' tasks complete</p></div><strong class="theme-text text-xl">' + percent + '%</strong></div>' + why + '<div class="mt-5"><h3 class="theme-text font-bold mb-2">Tasks</h3>' + (taskRows || '<p class="muted-text text-sm py-4">No tasks here yet.</p>') + '</div><button data-add-to-goal="' + (noGoal ? '' : goal.id) + '" class="btn-primary w-full min-h-[50px] rounded-xl mt-4">+ Add task</button>' + (!noGoal ? '<button id="editGoalBtn" class="btn-ghost w-full min-h-[48px] rounded-xl mt-3">Edit goal</button>' : '');
}

function renderTagManager() {
  var tags = state.tags.map(function (tag) { var colour = /^#[0-9a-f]{6}$/i.test(tag.colour || '') ? tag.colour : 'var(--muted)'; return '<div class="more-row"><span class="tag-chip" style="--tag-colour:' + colour + '">' + escapeHtml(tag.name) + '</span><span class="flex-1"></span><button data-rename-tag="' + tag.id + '" class="muted-text min-w-[44px] min-h-[44px]">Rename</button><button data-delete-tag="' + tag.id + '" class="min-w-[44px] min-h-[44px]" style="color:var(--danger)" aria-label="Delete tag">×</button></div>'; }).join('');
  return '<div id="tagBackdrop" class="sheet-backdrop"><section id="tagSheet" class="bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="tagTitle" tabindex="-1"><div class="sheet-handle"></div><div class="flex items-center justify-between"><h2 id="tagTitle" class="theme-text text-xl font-bold">Tags</h2><button id="closeTagManager" class="theme-text min-w-[44px] min-h-[44px] text-2xl">×</button></div>' + (tags || '<p class="muted-text text-sm py-4">No tags yet.</p>') + '<form id="tagForm" class="flex gap-2 mt-4"><input name="name" required maxlength="40" class="rounded-xl px-3 min-h-[48px] flex-1" placeholder="New tag"><input name="colour" type="color" value="#7c9bff" class="rounded-xl w-12 min-h-[48px] p-1" aria-label="Tag colour"><button class="btn-primary rounded-xl px-4">Add</button></form></section></div>';
}

function inboxZeroStreak() {
  var dates = normalizeWorkspace(state.cloud.workspace).inboxZeroDates;
  var count = 0, d = new Date();
  while (dates.indexOf(localDay(d)) !== -1) { count++; d.setDate(d.getDate() - 1); }
  return count;
}

function renderActivityPanel(emailCount) {
  var completed = state.tasks.filter(function (task) { return task.status === 'completed'; });
  var open = state.tasks.filter(function (task) { return task.status === 'open'; });
  var overdue = open.filter(function (task) { return task.scheduled_date && task.scheduled_date < localDay(); });
  var days = []; var weekTotal = 0;
  for (var offset = 6; offset >= 0; offset--) { var date = new Date(); date.setDate(date.getDate() - offset); var key = localDay(date); var count = completed.filter(function (task) { return task.completed_at && localDay(new Date(task.completed_at)) === key; }).length; weekTotal += count; days.push({ label: date.toLocaleDateString('en-GB',{weekday:'short'}).slice(0,1), count: count }); }
  var max = Math.max.apply(null, days.map(function (day) { return day.count; }).concat([1]));
  var bars = days.map(function (day) { return '<div class="text-center"><div class="progress-bar mx-auto" style="height:' + Math.max(4,Math.round(day.count/max*100)) + 'px" title="' + day.count + ' completed"></div><small class="muted-text block mt-2">' + day.label + '</small></div>'; }).join('');
  var recent = state.tasks.slice().sort(function (a,b) { return new Date(b.updated_at || b.created_at) - new Date(a.updated_at || a.created_at); }).slice(0,5);
  var activity = recent.map(function (task) { var completedState = task.status === 'completed'; return '<button data-edit-task="' + task.id + '" class="w-full flex gap-3 py-3 text-left border-b" style="border-color:var(--line)"><span style="color:' + (completedState ? 'var(--emerald)' : 'var(--accent)') + '">' + (completedState ? '✓' : '＋') + '</span><span><span class="theme-text text-sm block">' + escapeHtml(task.title) + '</span><small class="muted-text mt-1">' + (completedState ? 'Completed' : 'Updated') + ' · ' + new Date(task.updated_at || task.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short'}) + '</small></span></button>'; }).join('');
  var attention = overdue.length ? '<div class="card p-5 mb-5" style="border-color:rgba(251,113,133,.35)"><h2 class="theme-text font-semibold">Needs attention</h2><p class="muted-text text-sm mt-1 mb-3">' + overdue.length + ' overdue task' + (overdue.length === 1 ? '' : 's') + '</p>' + renderCanonicalTaskList(overdue.slice(0,3)) + '</div>' : '';
  return attention + '<div class="grid sm:grid-cols-3 gap-3 mb-5"><div class="card p-4"><p class="muted-text text-xs">Completed this week</p><p class="theme-text text-3xl font-bold mt-2">' + weekTotal + '</p></div><div class="card p-4"><p class="muted-text text-xs">Open now</p><p class="theme-text text-3xl font-bold mt-2">' + open.length + '</p></div><div class="card p-4"><p class="muted-text text-xs">Completion rate</p><p class="theme-text text-3xl font-bold mt-2">' + (state.tasks.length ? Math.round(completed.length/state.tasks.length*100) : 0) + '%</p></div></div><div class="card p-5 mb-5"><h2 class="theme-text font-semibold">Last seven days</h2><div class="progress-bars mt-4">' + bars + '</div></div><div class="card px-5"><h2 class="theme-text font-semibold pt-5">Recent task activity</h2>' + (activity || '<p class="muted-text text-sm py-5">Activity will appear when tasks change.</p>') + '</div>';
}

function renderCalendarAgenda() {
  if (!state.google.connected) return '<p class="muted-text text-sm">Connect Google Workspace to see your next events.</p>';
  var events = (state.liveData.calendar || []).slice(0, 3);
  if (!events.length) return '<p class="muted-text text-sm">No events in the next seven days.</p>';
  return '<div class="space-y-4">' + events.map(function (event) {
    var start = event.start ? new Date(event.start) : null;
    var when = start && !isNaN(start.getTime()) ? start.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }) + " · " + start.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }) : "Upcoming";
    return '<a class="block rounded-xl p-3" style="background:var(--panel-2);border:1px solid var(--line)" href="' + escapeHtml(safeExternalUrl(event.link)) + '" target="_blank" rel="noopener"><p class="theme-text text-sm font-semibold">' + escapeHtml(event.title) + '</p><p class="muted-text text-xs mt-1">' + escapeHtml(when) + '</p></a>';
  }).join("") + '</div>';
}

function renderQuickTaskForm(id, label, inCard) {
  var prefix = id.replace(/[^a-z0-9]/gi, '');
  var selectedProject = state.projectFilter !== 'all' && state.projectFilter !== 'none' ? state.projectFilter : '';
  if (state.pendingGoalId) { var pendingGoal = state.goals.find(function (goal) { return goal.id === state.pendingGoalId; }); if (pendingGoal) selectedProject = pendingGoal.project_id; }
  return '<form id="' + id + '" class="' + (inCard ? 'card p-4 sm:p-5' : '') + '">' +
    '<label class="theme-text text-sm font-semibold block mb-2">' + escapeHtml(label) + '</label>' +
    '<textarea name="title" required rows="5" class="quick-task-text w-full rounded-xl px-4 text-base" placeholder="Add a task, thought, reminder or idea..."></textarea>' +

  var items = Array.prototype.slice.call(dialog.querySelectorAll('button:not([disabled]),a[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'));

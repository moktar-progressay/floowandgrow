function attachVaultDocHandlers() {
  var upload = document.getElementById("vaultUploadInput");
  if (upload) upload.addEventListener("change", function () { var file = upload.files && upload.files[0]; if (file) uploadVaultFile(file); });
  var connectDrive = document.getElementById("connectVaultDrive");
  if (connectDrive) connectDrive.addEventListener("click", connectGoogleWorkspace);
  var projectFilter = document.getElementById("vaultProjectFilter");
  if (projectFilter) projectFilter.addEventListener("change", function () { state.vaultProjectFilter = projectFilter.value; render(); });
  var projectSelectors = document.querySelectorAll("[data-doc-project]");
  for (var p = 0; p < projectSelectors.length; p++) projectSelectors[p].addEventListener("change", function (e) { setVaultDocProject(e.currentTarget.getAttribute("data-doc-project"), e.currentTarget.getAttribute("data-drive-doc") === "1", e.currentTarget.value || null); });
  var openers = document.querySelectorAll(".open-doc-btn");
  for (var o = 0; o < openers.length; o++) openers[o].addEventListener("click", function (e) { openVaultDoc(e.currentTarget.getAttribute("data-id")); });
  var els = document.querySelectorAll(".edit-doc-btn");
  for (var i = 0; i < els.length; i++) els[i].addEventListener("click", function (e) {
    var id = e.currentTarget.getAttribute("data-id");
    var doc = state.cloud.docs.find(function (item) { return String(item.id) === id; });
    if (!doc) return;
    var name = window.prompt("Rename document", doc.name);
    if (name && name.trim()) { doc.name = name.trim(); scheduleCloudSave(); render(); }
  });
  els = document.querySelectorAll(".delete-doc-btn");
  for (var j = 0; j < els.length; j++) els[j].addEventListener("click", function (e) {
    var id = e.currentTarget.getAttribute("data-id");
    if (!window.confirm("Delete this Vault item?")) return;
    var doc = state.cloud.docs.find(function (item) { return String(item.id) === id; });
    var removal = doc && doc.storage_path ? sb.storage.from("focusos-documents").remove([doc.storage_path]) : Promise.resolve({ error: null });
    removal.then(function (result) { if (result.error) throw result.error; state.cloud.docs = state.cloud.docs.filter(function (item) { return String(item.id) !== id; }); scheduleCloudSave(); render(); }).catch(function (error) { showToast(error.message || "Could not delete document."); });
  });
}

function uploadVaultFile(file) {
  if (state.vaultUploading || !state.session) return;
  if (file.size > 50 * 1024 * 1024) { showToast("Choose a file smaller than 50 MB."); return; }
  state.vaultUploading = true; showToast("Uploading document...");
  var safeName = file.name.replace(/[^a-zA-Z0-9._-]+/g, "-");
  var path = state.session.user.id + "/" + Date.now() + "-" + safeName;
  sb.storage.from("focusos-documents").upload(path, file, { upsert: false, contentType: file.type || "application/octet-stream" }).then(function (result) {
    if (result.error) throw result.error;
    state.cloud.docs.unshift({ id: Date.now(), name: file.name, tag: "Uploaded", date: new Date().toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}), size: file.size < 1024 * 1024 ? Math.max(1,Math.round(file.size/1024)) + " KB" : (file.size/1024/1024).toFixed(1) + " MB", storage_path: path, project_id: state.vaultProjectFilter !== "all" && state.vaultProjectFilter !== "none" ? state.vaultProjectFilter : null });
    scheduleCloudSave(); state.vaultUploading = false; render(); showToast("Document added to Vault.");
  }).catch(function (error) { state.vaultUploading = false; showToast(error.message || "Upload failed."); });
}

function setVaultDocProject(id, isDrive, projectId) {
  if (isDrive) {
    state.cloud.connections = state.cloud.connections || {};
    state.cloud.connections.vaultProjectMap = state.cloud.connections.vaultProjectMap || {};
    if (projectId) state.cloud.connections.vaultProjectMap[id] = projectId;
    else delete state.cloud.connections.vaultProjectMap[id];
  } else {
    var doc = state.cloud.docs.find(function (item) { return String(item.id) === String(id); });
    if (!doc) return;
    doc.project_id = projectId || null;
  }
  scheduleCloudSave();
  render();
  showToast("Document project updated.");
}

function openVaultDoc(id) {
  var doc = state.cloud.docs.find(function (item) { return String(item.id) === String(id); });
  if (!doc || !doc.storage_path) return;
  var target = window.open("", "_blank");
  sb.storage.from("focusos-documents").createSignedUrl(doc.storage_path, 60).then(function (result) { if (result.error) throw result.error; if (target) target.location = result.data.signedUrl; else window.location.assign(result.data.signedUrl); }).catch(function (error) { if (target) target.close(); showToast(error.message || "Could not open document."); });
}

function renderVaultDocsOnly() {
  var docs = getFilteredDocs();
  if (docs.length === 0) return state.vaultQuery.trim()
    ? '<p class="text-slate-500 text-sm text-center py-16">Nothing matches that search. Try a different keyword.</p>'
    : '<div class="text-center py-16"><p class="theme-text text-sm font-semibold">Your vault is empty</p><p class="muted-text text-xs mt-2">Save a brain dump or connect Google Drive to add real documents.</p></div>';
  function renderDocCard(doc) {
    var localDoc = !doc.drive && state.cloud.docs.some(function (item) { return String(item.id) === String(doc.id); });
    return '<div class="doc-card rounded-xl p-4" style="background:var(--panel-2);border:1px solid var(--line)"><div class="flex items-start justify-between mb-3"><span class="text-xl">\ud83d\udcc4</span><span class="tag-chip">' + escapeHtml(doc.tag || (doc.drive ? 'Drive' : 'Document')) + '</span></div>' +
      (doc.drive ? '<a class="text-sm theme-text font-semibold leading-snug mb-1 block" href="' + escapeHtml(safeExternalUrl(doc.link)) + '" target="_blank" rel="noopener">' + (doc.starred ? '★ ' : '') + escapeHtml(doc.name) + '</a>' : '<p class="text-sm theme-text font-semibold leading-snug mb-1">' + escapeHtml(doc.name) + '</p>') +
      '<p class="muted-text text-xs">' + escapeHtml(doc.date || '') + (doc.size ? ' · ' + escapeHtml(doc.size) : '') + '</p><label class="muted-text text-[11px] block mt-3">Project<select data-doc-project="' + escapeHtml(String(doc.id)) + '" data-drive-doc="' + (doc.drive ? '1' : '0') + '" class="w-full rounded-lg px-2 min-h-[42px] mt-1">' + projectOptions(doc.project_id || '') + '</select></label>' +
      (localDoc ? '<div class="flex flex-wrap gap-2 mt-3">' + (doc.storage_path ? '<button class="open-doc-btn btn-primary rounded-lg px-3 min-h-[40px] text-xs" data-id="' + escapeHtml(String(doc.id)) + '">Open</button>' : '') + '<button class="edit-doc-btn btn-ghost rounded-lg px-3 min-h-[40px] text-xs" data-id="' + escapeHtml(String(doc.id)) + '">Rename</button><button class="delete-doc-btn btn-ghost rounded-lg px-3 min-h-[40px] text-xs" style="color:var(--danger)" data-id="' + escapeHtml(String(doc.id)) + '">Delete</button></div>' : '<p class="muted-text text-[10px] mt-3">Read-only from Google Drive</p>') + '</div>';
  }
  var groups = state.projects.map(function (project) { return { id: project.id, name: project.name, colour: projectColour(project.id), docs: docs.filter(function (doc) { return doc.project_id === project.id; }) }; }).filter(function (group) { return group.docs.length; });
  var unassigned = docs.filter(function (doc) { return !doc.project_id; });
  if (unassigned.length) groups.push({ id: 'none', name: 'No project', colour: 'var(--muted)', docs: unassigned });
  return '<div class="space-y-4">' + groups.map(function (group) { return '<section class="vault-group"><div class="vault-group-header flex items-center gap-3"><span style="color:' + group.colour + '">▣</span><strong class="theme-text flex-1">' + escapeHtml(group.name) + '</strong><span class="muted-text text-xs">' + group.docs.length + '</span></div><div class="grid grid-cols-1 sm:grid-cols-2 gap-3 p-3">' + group.docs.map(renderDocCard).join('') + '</div></section>'; }).join('') + '</div>';
}

function spawnXpFloater(amount) {
  var zone = document.getElementById("xpFloaterZone");
  if (!zone) return;
  var span = document.createElement("span");
  span.className = "xp-float font-bold text-sm";
  span.style.color = "#34d399";
  span.textContent = "+" + amount + " XP";
  zone.appendChild(span);
  setTimeout(function () { span.remove(); }, 1300);
}

/* ============================================================
   POMODORO
============================================================ */
var pomodoroInterval = null;
function startPomodoroTicker() {
  clearInterval(pomodoroInterval);
  pomodoroInterval = setInterval(function () {
    if (!state.pomodoro.running) return;
    state.pomodoro.secondsLeft -= 1;
    if (state.pomodoro.secondsLeft <= 0) {
      state.pomodoro.secondsLeft = 0;
      state.pomodoro.running = false;
      playBeep();
      flashTitle();
    }
    var el = document.getElementById("pomoDisplay");
    if (el) {
      var mm = String(Math.floor(state.pomodoro.secondsLeft / 60)).padStart(2, "0");
      var ss = String(state.pomodoro.secondsLeft % 60).padStart(2, "0");
      el.textContent = mm + ":" + ss;
    }
    var flowEl = document.getElementById("flowPomoDisplay");
    if (flowEl) {
      var flowMm = String(Math.floor(state.pomodoro.secondsLeft / 60)).padStart(2, "0");
      var flowSs = String(state.pomodoro.secondsLeft % 60).padStart(2, "0");
      flowEl.textContent = flowMm + ":" + flowSs;
    }
    var toggleBtn = document.getElementById("pomoToggleBtn");
    if (toggleBtn && !state.pomodoro.running) toggleBtn.textContent = "\u25b6";
  }, 1000);
}
function togglePomodoro() {
  state.pomodoro.running = !state.pomodoro.running;
  var btn = document.getElementById("pomoToggleBtn");
  if (btn) btn.textContent = state.pomodoro.running ? "\u23f8" : "\u25b6";
}
function resetPomodoro() {
  state.pomodoro.running = false;
  state.pomodoro.secondsLeft = pomodoroSecondsForMode(state.pomodoro.mode);
  clearInterval(state.pomodoro.titleTimerId);
  document.title = ORIGINAL_TITLE;
  render();
}
function switchPomodoroMode(mode) {
  state.pomodoro.mode = mode;
  state.pomodoro.running = false;
  state.pomodoro.secondsLeft = pomodoroSecondsForMode(mode);
  clearInterval(state.pomodoro.titleTimerId);
  document.title = ORIGINAL_TITLE;
  render();
}
function pomodoroSecondsForMode(mode) {
  if (mode === 'long') return 15 * 60;
  if (mode === 'custom') return Math.max(1,Math.min(180,Number(state.pomodoro.customMinutes)||25)) * 60;
  return mode === 'focus' ? FOCUS_SECONDS : BREAK_SECONDS;
}
function playBeep() {
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = ctx.createOscillator(); var gain = ctx.createGain();
    osc.type = "sine"; osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    osc.connect(gain).connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.35);
  } catch (e) {}
}
function flashTitle() {
  var flip = false;
  clearInterval(state.pomodoro.titleTimerId);
  state.pomodoro.titleTimerId = setInterval(function () { document.title = flip ? ORIGINAL_TITLE : "\u26a0\ufe0f TIMES UP!"; flip = !flip; }, 900);
  setTimeout(function () { clearInterval(state.pomodoro.titleTimerId); document.title = ORIGINAL_TITLE; }, 8000);
}

/* ============================================================
   ASSISTANT LOGIC
============================================================ */
function runCleanup() {
  var raw = (document.getElementById("chaoticInput").value || "").trim();
  var draftOutput = document.getElementById("draftOutput");
  var safetyOutput = document.getElementById("safetyOutput");
  if (!raw) { showToast("Type something in first."); return; }

  var lower = raw.toLowerCase();
  var hasDeadline = /\b(today|tomorrow|by \w+|deadline|due|end of day|eod|\d{1,2}\/\d{1,2}|monday|tuesday|wednesday|thursday|friday|saturday|sunday|thurs)\b/.test(lower);
  var hasAmount = /\$\d|\d+\s?(dollars|usd)/.test(lower);
  var hasAttachment = /\battach(ed|ment)?\b/.test(lower);
  var hasCC = /\bcc\b/.test(lower);

  var sentences = raw.replace(/\s+/g, " ").split(/(?<=[.?!])\s+|(?=\bhey\b)|(?=\balso\b)/i).map(function (s) { return s.trim(); }).filter(Boolean);
  var bodyLines = sentences.map(function (s) {
    var clean = s.replace(/^(hey|hi|hello)\b[,]?\s*/i, "").replace(/\bu\b/gi, "you").replace(/\basap\b/gi, "as soon as possible")
      .replace(/\bi think\?*/gi, "").replace(/\bnot 100% sure\b/gi, "").replace(/\bcan u\b/gi, "could you").trim();
    if (!clean) return null;
    clean = clean.charAt(0).toUpperCase() + clean.slice(1);
    if (!/[.?!]$/.test(clean)) clean += ".";
    return clean;
  }).filter(Boolean);

  var draft = "Hi there,\n\n" + bodyLines.join(" ") + "\n\nPlease let me know if you have any questions.\n\nBest regards";
  draftOutput.textContent = draft;
  draftOutput.classList.remove("fade-line");
  draftOutput.classList.add("text-slate-100");

  var alerts = [];
  if (!hasDeadline) alerts.push("No definitive completion date detected - check your calendar before sending.");
  if (!hasAmount && /invoice|payment|budget|cost|price|deposit/.test(lower)) alerts.push("Money is referenced but no specific amount was found - confirm the figure.");
  if (!hasAttachment && /attach|file|document|pdf|deck|agreement/.test(lower)) alerts.push("A file is mentioned but attachment status wasn't confirmed.");
  if (!hasCC && /accountant|lawyer|manager|team|client/.test(lower)) alerts.push("Another party is mentioned - confirm whether they need to be CC'd.");
  if (raw.length < 25) alerts.push("This message is very short - make sure nothing essential was left out.");
  if (alerts.length === 0) alerts.push("Nothing obvious is missing - still worth a final read before sending.");

  safetyOutput.innerHTML = alerts.map(function (msg) {
    return '<div class="rounded-lg px-3 py-2.5 text-sm flex items-start gap-2 mb-2" style="background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.25);color:#fde68a;"><span>\ud83d\udee1\ufe0f</span><span>' + escapeHtml(msg) + '</span></div>';
  }).join("");
}
function copyDraft() {
  var text = document.getElementById("draftOutput").textContent;
  if (!text || text.indexOf("Run cleanup to see") !== -1) { showToast("Nothing to copy yet."); return; }
  navigator.clipboard.writeText(text).then(function () {
    var btn = document.getElementById("copyDraftBtn");
    var original = btn.textContent;
    btn.textContent = "Copied \u2713";
    setTimeout(function () { btn.textContent = original; }, 1500);
  }).catch(function () { showToast("Could not copy - select the text manually."); });
}

/* ============================================================
   CONNECTIONS TEST
============================================================ */
function testConnection(key) {
  var conn = state.cloud.connections[key] || {};
  if (!conn.url) {
    conn.status = "error: missing endpoint URL";
    state.cloud.connections[key] = conn;
    scheduleCloudSave();
    render();
    return;
  }
  var headers = conn.token ? { Authorization: "Bearer " + conn.token } : {};
  fetch(conn.url, { headers: headers }).then(function (res) {
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.json().catch(function () { return null; });
  }).then(function (json) {
    conn.status = "connected";
    state.cloud.connections[key] = conn;
    state.liveData[key] = json;
    scheduleCloudSave();
    render();
  }).catch(function (err) {
    conn.status = "error: " + (err.message || "network/CORS blocked");
    state.cloud.connections[key] = conn;
    scheduleCloudSave();
    render();
  });
}

  if (event.key === "Escape") { if (closeTopOverlay()) event.preventDefault(); return; }
  trapDialogFocus(event);
});
document.addEventListener("visibilitychange", function () {
  var orb = document.getElementById("breathingOrb");
  if (orb) orb.classList.toggle("paused", document.hidden);
});
render();
initAuth();
